name: CI

# 문서만 바뀐 push 는 돌리지 않는다(앱 · 배포가 그대로다). 예외: PRIVACY.md 는 앱 안에 들어가고, docs/STORE.md 는 단위 테스트(store.test)가 읽는다
on:
  push:
    branches: [main]
    paths: ['**', '!**.md', '!docs/**', '!LICENSE', 'PRIVACY.md', 'docs/STORE.md']
  pull_request:
    paths: ['**', '!**.md', '!docs/**', '!LICENSE', 'PRIVACY.md', 'docs/STORE.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · boundaries · unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run test:audio

  build:
    # check 와 나란히 — 빌드는 타입 검사·단위 결과를 쓰지 않는다. e2e 가 check 끝을 기다리지 않고 바로 시작한다
    name: build (pages + capacitor base)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run build:cap
      - uses: actions/upload-artifact@v6
        with: { name: dist-capacitor, path: dist, retention-days: 7 }

  e2e-shard:
    # 전체 시나리오를 한 러너에서 돌리면 25 분을 넘긴다(느린 러너) — 3 묶음으로 나눠 병렬로. 하나라도 실패하면 CI 가 실패해 배포되지 않는다
    # Playwright 공식 이미지 — 브라우저와 시스템 라이브러리가 들어 있어 샤드마다 apt 설치(install-deps)를 하지 않는다.
    # 태그는 package-lock 의 playwright 버전과 같아야 한다(브라우저 리비전이 버전에 묶여 있다) — scripts/ci-image.test.mjs 가 지킨다
    name: e2e shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    timeout-minutes: 30
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v7
        with: { name: dist-capacitor, path: dist }
      - run: test -f dist/index.html # 아티팩트가 다른 곳에 풀리면 serve 가 디렉터리 목록을 내놓고 e2e 가 전부 실패한다 — 여기서 바로 멈춘다
      - run: node scripts/e2e.mjs --dist dist --shard ${{ matrix.shard }}
